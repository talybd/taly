<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>বিসমিল্লাহ কম্পিউটারস - এ৪ পোর্ট্রেট এডিশন</title>
    <link href="https://fonts.cdnfonts.com/css/solaimanlipi" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/gh/hasan-rahim/Avro-Phonetic-JS@master/dist/avro-phonetic.min.js"></script>
    
    <style>
        body { 
            font-family: 'SolaimanLipi', 'Segoe UI', Tahoma, sans-serif; 
            padding: 10px; color: #333; font-size: 15px; margin: 0;
            background: url('https://images.unsplash.com/photo-1725818272671-84a427d09527?auto=format&fit=crop&q=80&w=1920') no-repeat center fixed;
            background-size: cover;
        }

        /* --- লগইন পেজ --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1421789665209-c9b2a435e3dc?auto=format&fit=crop&q=80&w=1920') no-repeat center;
            background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(8px);
        }
        .zori-text { font-size: 65px; font-weight: 900; background: linear-gradient(#FFF5A5, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.8)); margin-bottom: 25px; animation: float 3s infinite; }
        .login-content { display: flex; flex-direction: column; align-items: center; gap: 15px; }

        /* --- 3D বাটন --- */
        .btn-3d { font-family: 'SolaimanLipi'; padding: 10px 18px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.1s; margin: 3px; font-size: 15px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .btn-stock { background: #3498db; box-shadow: 0 5px 0 #2980b9; }
        .btn-sales { background: #9b59b6; box-shadow: 0 5px 0 #8e44ad; }
        .btn-save { background: #27ae60; box-shadow: 0 5px 0 #219150; }
        .btn-logout { background: #e74c3c; box-shadow: 0 5px 0 #c0392b; }
        .btn-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        /* --- মেইন কন্টেইনার --- */
        .container { max-width: 1100px; margin: auto; background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.3); position: relative; }
        
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e5631; padding-bottom: 10px; margin-bottom: 15px; }
        .shop-header { display: flex; align-items: center; gap: 15px; }
        
        .custom-logo { 
            width: 85px; height: 85px; border-radius: 50%; 
            border: 2px solid #1e5631; object-fit: cover; 
            image-rendering: -webkit-optimize-contrast; 
            filter: contrast(1.1) brightness(1.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .shop-details { display: flex; flex-direction: column; gap: 2px; }
        .shop-name { font-size: 24px; color: #1a237e; margin: 0; font-weight: bold; line-height: 1.1; }
        .header-info { font-size: 14px; font-weight: bold; color: #444; margin: 0; line-height: 1.2; }

        .print-date { font-size: 13px; font-weight: bold; color: #555; text-align: right; }

        /* --- টেবিল ডিজাইন --- */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid #1e5631; padding: 8px 4px; text-align: center; word-wrap: break-word; font-size: 14px; }
        th { background: #e8f5e9 !important; color: #1a237e !important; border: 2px solid #1e5631 !important; }
        .input-cell { width: 95%; border: none; background: transparent; text-align: center; font-family: 'SolaimanLipi'; font-size: 14px; outline: none; }

        /* --- প্রিন্ট লজিক --- */
        @media print {
            @page { size: A4 portrait; margin: 0.8cm; }
            body { background: white !important; padding: 0 !important; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .container { display: block !important; width: 100% !important; border: none !important; box-shadow: none !important; background: white !important; padding: 0 !important; }
            table { width: 100% !important; table-layout: auto !important; }
            body.print-stock th:nth-child(n+8), body.print-stock td:nth-child(n+8) { display: none !important; }
            body.print-sales th:nth-child(2), body.print-sales td:nth-child(2),
            body.print-sales th:nth-child(3), body.print-sales td:nth-child(3),
            body.print-sales th:nth-child(4), body.print-sales td:nth-child(4),
            body.print-sales th:nth-child(5), body.print-sales td:nth-child(5),
            body.print-sales th:nth-child(6), body.print-sales td:nth-child(6),
            body.print-sales th:nth-child(7), body.print-sales td:nth-child(7) { display: none !important; }
            th { background: #f2f2f2 !important; color: black !important; border: 1px solid #000 !important; }
            td { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="zori-text">বিসমিল্লাহ কম্পিউটারস</div>
    <div style="background: rgba(255,255,255,0.15); padding: 40px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); width: 320px;">
        <img src="https://scontent.fdac185-1.fna.fbcdn.net/v/t39.30808-1/519723426_1663218567959916_6251427606797456099_n.jpg?stp=cp0_dst-jpg_s60x60_tt6&_nc_cat=102&ccb=1-7&_nc_sid=2d3e12&_nc_eui2=AeGNvZL8nbcBlfkRehLV3DfY0RXm_4AYRVrRFeb_gBhFWmn3VnkU9el-ZNf5wC-h4H5JilqueyVamGEwdaS_XDuL&_nc_ohc=5AytextxWOoQ7kNvwFIKgJK&_nc_oc=Adqu5jZJ0mXC3F8lxPgiJiFKIaJvq7CcRZ65t3_G_XMCfhvGhN42lTlWhkTRqO3CZ7k&_nc_zt=24&_nc_ht=scontent.fdac185-1.fna&_nc_gid=OuQ_mOm6a-fy2wrYi2ruYw&_nc_ss=7a30f&oh=00_AfxgrGXpJba00mbM4ZBgbPKYgSGsm6bbq-zbS2W0z4yRmA&oe=69C2A07F" style="width:100px; height:100px; border-radius:50%; margin-bottom:15px; border:3px solid gold;">
        <h3 style="color:white; margin: 10px 0;">ম্যানেজমেন্ট লগইন</h3>
        <div class="login-content">
            <input type="text" id="userInput" placeholder="ইউজারনেম" style="width: 100%; padding: 12px; border-radius: 8px; border: none;">
            <input type="password" id="passInput" placeholder="পাসওয়ার্ড" style="width: 100%; padding: 12px; border-radius: 8px; border: none;">
            <button class="btn-3d btn-save" style="width: 100%; margin-top: 10px;" onclick="attemptLogin()">প্রবেশ করুন</button>
        </div>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="header-wrapper">
        <div class="shop-header">
            <img src="https://scontent.fdac185-1.fna.fbcdn.net/v/t39.30808-1/519723426_1663218567959916_6251427606797456099_n.jpg?stp=cp0_dst-jpg_s60x60_tt6&_nc_cat=102&ccb=1-7&_nc_sid=2d3e12&_nc_eui2=AeGNvZL8nbcBlfkRehLV3DfY0RXm_4AYRVrRFeb_gBhFWmn3VnkU9el-ZNf5wC-h4H5JilqueyVamGEwdaS_XDuL&_nc_ohc=5AytextxWOoQ7kNvwFIKgJK&_nc_oc=Adqu5jZJ0mXC3F8lxPgiJiFKIaJvq7CcRZ65t3_G_XMCfhvGhN42lTlWhkTRqO3CZ7k&_nc_zt=24&_nc_ht=scontent.fdac185-1.fna&_nc_gid=OuQ_mOm6a-fy2wrYi2ruYw&_nc_ss=7a30f&oh=00_AfxgrGXpJba00mbM4ZBgbPKYgSGsm6bbq-zbS2W0z4yRmA&oe=69C2A07F" class="custom-logo" alt="Logo">
            <div class="shop-details">
                <h1 class="shop-name">বিসমিল্লাহ কম্পিউটারস এন্ড মোবাইল সার্ভিসিং</h1>
                <p class="header-info">📍 হামেদখানের হাট, কালকিনি, মাদারীপুর।</p>
                <p class="header-info">📞 01770434746, 09649434746</p>
            </div>
        </div>
        <div class="print-date" id="dateDisplay"></div>
    </div>

    <div class="no-print" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: #f0f9f4; padding: 15px; border-radius: 10px;">
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="searchInput" onkeypress="if(event.key === 'Enter') filterData()" placeholder="মালের নাম..." style="padding: 10px; border: 1px solid #1e5631; border-radius: 5px; width: 150px;">
            <select id="categoryFilter" onchange="filterData()" style="padding: 10px; border-radius: 5px; border: 1px solid #1e5631;">
                <option value="">সকল ক্যাটাগরি</option>
            </select>
            <button class="btn-3d btn-stock" onclick="printR('stock')">🖨️ স্টক</button>
            <button class="btn-3d btn-sales" onclick="printR('sales')">🖨️ সেলস</button>
        </div>
        <div>
            <span id="syncStatus" style="display:none; color: green; font-weight: bold; margin-right: 10px;">সিঙ্ক হচ্ছে...</span>
            <button class="btn-3d btn-save" onclick="saveData()">💾 ডাটা সেভ</button>
            <button class="btn-3d btn-logout" onclick="location.reload()">🔒 লগআউট</button>
        </div>
    </div>

    <table id="hishabTable">
        <thead>
            <tr>
                <th width="40">নং</th>
                <th width="180">মালের নাম</th>
                <th width="110">ক্যাটাগরি</th>
                <th width="65">পরিমাণ</th>
                <th width="85">ক্রয়মূল্য</th>
                <th width="100">মোট মূল্য</th>
                <th>মন্তব্য</th>
                <th width="75">বিক্রি</th>
                <th width="75">অবশিষ্ট</th>
                <th class="no-print" width="45">#</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <div class="no-print" style="margin-top: 25px;">
        <button class="btn-3d" style="background: #f39c12; box-shadow: 0 5px 0 #d35400;" onclick="addRow()">➕ নতুন মাল যোগ করুন</button>
    </div>
</div>

<script>
    // আপনার নতুন গুগল স্ক্রিপ্ট লিঙ্ক এখানে বসানো হয়েছে
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaiZOUJAg2Mg85z94LF0Txr3CuvUac-8z0wYm0QYcNNjgou6BBHD8dPxrBMzhBwMTS-w/exec";
    const VALID_USER = "admin", VALID_PASS = "0000";

    function updateDate() {
        const d = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('dateDisplay').innerText = "তারিখ: " + d.toLocaleDateString('bn-BD', options);
    }

    function attemptLogin() {
        if(document.getElementById('userInput').value === VALID_USER && document.getElementById('passInput').value === VALID_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            updateDate(); fetchData();
        } else { alert("ভুল তথ্য!"); }
    }

    function addRow(d = []) {
        const row = document.getElementById('tableBody').insertRow();
        row.innerHTML = `
            <td></td>
            <td><input type="text" class="input-cell p-name avro-bangla" value="${d[1]||''}"></td>
            <td><input type="text" class="input-cell p-cat avro-bangla" value="${d[2]||''}" oninput="updateCats()"></td>
            <td><input type="number" class="input-cell p-qty" value="${d[3]||0}" oninput="calc(this)"></td>
            <td><input type="number" class="input-cell p-price" value="${d[4]||0}" oninput="calc(this)"></td>
            <td class="p-total" style="font-weight:bold; color:#1e5631;">0</td>
            <td><input type="text" class="input-cell p-note avro-bangla" value="${d[5]||''}"></td>
            <td><input type="number" class="input-cell p-sold" value="${d[6]||0}" oninput="calc(this)"></td>
            <td class="p-rem" style="font-weight:bold; color:#e67e22;">0</td>
            <td class="no-print"><span style="color:red; cursor:pointer; font-weight:bold;" onclick="this.closest('tr').remove();updateSN();">✖</span></td>
        `;
        
        // অটো-বাংলা টাইপিং এনাবেল করা
        row.querySelectorAll('.avro-bangla').forEach(input => {
            input.addEventListener('keydown', function() {
                if (typeof avroPhonetic !== 'undefined') avroPhonetic.parse(this);
            });
        });

        updateSN(); calc(row.querySelector('.p-qty')); updateCats();
    }

    function calc(el) {
        const r = el.closest('tr');
        const q = Number(r.querySelector('.p-qty').value), p = Number(r.querySelector('.p-price').value), s = Number(r.querySelector('.p-sold').value);
        r.querySelector('.p-total').innerText = (q * p);
        r.querySelector('.p-rem').innerText = (q - s);
    }

    function updateSN() { document.querySelectorAll('#tableBody tr').forEach((r, i) => r.cells[0].innerText = i + 1); }

    function updateCats() {
        const cats = new Set();
        document.querySelectorAll('.p-cat').forEach(i => { if(i.value.trim()) cats.add(i.value.trim()); });
        const select = document.getElementById('categoryFilter');
        const cur = select.value;
        select.innerHTML = '<option value="">সকল ক্যাটাগরি</option>';
        cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.innerText = c; select.appendChild(o); });
        select.value = cur;
    }

    function filterData() {
        const s = document.getElementById('searchInput').value.toUpperCase();
        const c = document.getElementById('categoryFilter').value.toUpperCase();
        document.querySelectorAll('#tableBody tr').forEach(r => {
            const name = r.querySelector('.p-name').value.toUpperCase();
            const cat = r.querySelector('.p-cat').value.toUpperCase();
            r.style.display = (name.includes(s) && (c === "" || cat === c)) ? "" : "none";
        });
    }

    function printR(t) {
        updateDate();
        document.body.classList.remove('print-stock', 'print-sales');
        document.body.classList.add('print-' + t);
        setTimeout(() => { window.print(); }, 500);
    }

    async function saveData() {
        document.getElementById('syncStatus').style.display = "inline";
        const rows = Array.from(document.querySelectorAll('#tableBody tr')).map((r, i) => [
            i + 1, r.querySelector('.p-name').value, r.querySelector('.p-cat').value, r.querySelector('.p-qty').value, r.querySelector('.p-price').value, r.querySelector('.p-note').value, r.querySelector('.p-sold').value
        ]);
        try { 
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(rows) }); 
            alert("সেভ সম্পন্ন!"); 
        } catch (e) { 
            alert("ত্রুটি!"); 
        }
        document.getElementById('syncStatus').style.display = "none";
    }

    async function fetchData() {
        try { 
            const r = await fetch(SCRIPT_URL); 
            const d = await r.json(); 
            document.getElementById('tableBody').innerHTML = ""; 
            if(d.length) d.forEach(addRow); 
            else addRow(); 
        } catch (e) { 
            addRow(); 
        }
    }
</script>
</body>
</html>
